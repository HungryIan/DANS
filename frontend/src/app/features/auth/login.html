<div class="auth-layout">
  <app-auth-brand />

  <main class="auth-main">
    <form class="auth-card form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <a class="brand auth-mobile-brand" routerLink="/" style="padding: 0; color: var(--text)">
        <span class="brand-mark"><span class="icon filled">crisis_alert</span></span>
        <span class="brand-name">DANS</span>
      </a>

      <div>
        <h2>Sign in</h2>
        <p class="subtitle">Sign in to receive alerts for your barangay and report emergencies.</p>
      </div>

      @if (error()) {
        <div class="callout callout-danger" role="alert"><span class="icon">error</span>{{ error() }}</div>
      }

      <label class="field">
        <span class="field-label">Email address</span>
        <input class="input" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="error-text"><span class="icon">error</span>Enter a valid email address.</span>
        }
      </label>

      <label class="field">
        <span class="field-label">Password</span>
        <span class="input-group">
          <input class="input" [type]="showPassword() ? 'text' : 'password'" formControlName="password" autocomplete="current-password" />
          <button type="button" class="btn btn-ghost btn-icon" (click)="showPassword.set(!showPassword())"
                  [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
            <span class="icon">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </span>
        @if (form.controls.password.touched && form.controls.password.invalid) {
          <span class="error-text"><span class="icon">error</span>Enter your password.</span>
        }
      </label>

      <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="busy()">
        @if (busy()) { <span class="spinner"></span> } Sign in
      </button>

      <p class="center text-2">No account yet? <a class="link" routerLink="/register">Create one</a></p>
      <p class="center small"><a class="link" routerLink="/">Continue without signing in</a></p>

      @if (demoMode) {
        <div class="demo-box">
          <h3>Demo accounts</h3>
          <div class="demo-accounts">
            @for (account of demoAccounts; track account.email) {
              <button type="button" class="btn btn-sm" (click)="useDemo(account)">{{ account.role }}</button>
            }
          </div>
        </div>
      }
    </form>
  </main>
</div>
