<div class="auth-layout">
  <app-auth-brand />

  <main class="auth-main">
    <form class="auth-card form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <a class="brand auth-mobile-brand" routerLink="/" style="padding: 0; color: var(--text)">
        <span class="brand-mark"><span class="icon filled">crisis_alert</span></span>
        <span class="brand-name">DANS</span>
      </a>

      <div>
        <h2>Create your account</h2>
        <p class="subtitle">Register as a resident to receive alerts for your barangay and report emergencies.</p>
      </div>

      @if (error()) {
        <div class="callout callout-danger" role="alert"><span class="icon">error</span>{{ error() }}</div>
      }

      <label class="field">
        <span class="field-label">Full name</span>
        <input class="input" formControlName="fullName" autocomplete="name" placeholder="Juan Dela Cruz" />
        @if (invalid('fullName')) {
          <span class="error-text"><span class="icon">error</span>Enter your full name.</span>
        }
      </label>

      <div class="form-grid">
        <label class="field">
          <span class="field-label">Email address</span>
          <input class="input" type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" />
          @if (invalid('email')) {
            <span class="error-text"><span class="icon">error</span>Enter a valid email.</span>
          }
        </label>
        <label class="field">
          <span class="field-label">Mobile number</span>
          <input class="input" type="tel" formControlName="phoneNumber" autocomplete="tel" placeholder="09171234567" />
          @if (invalid('phoneNumber')) {
            <span class="error-text"><span class="icon">error</span>Use the format 09XXXXXXXXX.</span>
          }
        </label>
      </div>

      <div class="form-grid">
        <label class="field">
          <span class="field-label">Barangay</span>
          <select class="input" formControlName="barangayId">
            <option [ngValue]="0" disabled>Select your barangay</option>
            @for (b of barangays(); track b.id) {
              <option [ngValue]="b.id">{{ b.name }}</option>
            }
          </select>
          @if (invalid('barangayId')) {
            <span class="error-text"><span class="icon">error</span>Select your barangay.</span>
          } @else {
            <span class="hint">Alerts for this barangay are sent to you.</span>
          }
        </label>
        <label class="field">
          <span class="field-label">Purok / street <span class="optional">(optional)</span></span>
          <input class="input" formControlName="address" autocomplete="street-address" placeholder="Purok 2" />
        </label>
      </div>

      <div class="form-grid">
        <label class="field">
          <span class="field-label">Password</span>
          <input class="input" type="password" formControlName="password" autocomplete="new-password" />
          @if (invalid('password')) {
            <span class="error-text"><span class="icon">error</span>{{ passwordHint }}</span>
          } @else {
            <span class="hint">{{ passwordHint }}</span>
          }
        </label>
        <label class="field">
          <span class="field-label">Confirm password</span>
          <input class="input" type="password" formControlName="confirmPassword" autocomplete="new-password" />
          @if (form.controls.confirmPassword.touched && form.hasError('mismatch')) {
            <span class="error-text"><span class="icon">error</span>Passwords do not match.</span>
          }
        </label>
      </div>

      <div class="field">
        <label class="check consent">
          <input type="checkbox" formControlName="acceptPrivacyNotice" />
          <span>I have read the <a class="link" routerLink="/privacy" target="_blank">privacy notice</a> and agree that DANS may use my
            details to send me alerts for my barangay and to let responders contact me about emergencies I report.</span>
        </label>
        @if (invalid('acceptPrivacyNotice')) {
          <span class="error-text"><span class="icon">error</span>Please agree to the privacy notice to create an account.</span>
        }
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" [disabled]="busy()">
        @if (busy()) { <span class="spinner"></span> } Create account
      </button>

      <p class="center text-2">Already registered? <a class="link" routerLink="/login">Sign in</a></p>
    </form>
  </main>
</div>
